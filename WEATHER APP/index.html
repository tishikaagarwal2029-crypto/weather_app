<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./weather.css">
</head>
<body>
    <header>
        <div class="input-container">
        <input type="text" name="" id="location" placeholder="Enter Location">
        <button id="btn">Search</button>
        </div>
    </header>

    
    <main>
        <div class="weather-container">
            <div class="temp">12.5 C</div>
            <div class="location-data">
            <div class="location">Delhi</div>
            <span class="time">9:15</span>
            <span class="day">Friday</span>
            <span class="date">2026-01-30</span>
            </div>
            <div class="weather-status">
                <div class="icon">
                    <img src="https://api.weatherapi.com/v1/current.json?key=c7236d36debb4636a18170654262201&q=pune&aqi=no" alt="weather-status-image">
                </div>
                <div class="condition"></div>
                
            </div>
        </div></main>
        
        

    </div>
</body>
</html>
